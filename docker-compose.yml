services:

  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_etl
    
    ports:
      - "3306:3306"
    
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ecommerce-etl

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: ecommerce_etl

    depends_on:
      mysql:
        condition: service_healthy