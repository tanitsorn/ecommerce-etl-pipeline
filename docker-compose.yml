services:

  mysql:
    image: mysql:8.0
    container_name: ecommerce-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_etl

    ports:
      - "3306:3306"

    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    container_name: ecommerce-etl

    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: ecommerce_etl

    depends_on:
      mysql:
        condition: service_healthy


  airflow-postgres:
    image: postgres:16
    container_name: ecommerce-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data


  airflow-api:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce-airflow-api

    command: api-server --port 8080

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      PYTHONPATH: /opt/airflow

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: ecommerce_etl

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./python:/opt/airflow/python
      - ./data:/opt/airflow/data

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy
      airflow-postgres:
        condition: service_started

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce-airflow-scheduler

    command: scheduler

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      PYTHONPATH: /opt/airflow

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: ecommerce_etl

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./python:/opt/airflow/python
      - ./data:/opt/airflow/data

    depends_on:
      mysql:
        condition: service_healthy
      airflow-postgres:
        condition: service_started
      
  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: ecommerce-airflow-dag-processor

    command: dag-processor

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      PYTHONPATH: /opt/airflow

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: ecommerce_etl

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./python:/opt/airflow/python
      - ./data:/opt/airflow/data

    depends_on:
      airflow-postgres:
        condition: service_started

volumes:
  airflow-postgres-data: